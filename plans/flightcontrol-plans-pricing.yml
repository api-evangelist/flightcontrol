specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Flightcontrol
providerId: flightcontrol
created: '2026-06-20'
modified: '2026-06-20'
reconciled: true
tags:
- Deployment
- AWS
- PaaS
- Infrastructure
- DevOps
- Plans
description: >-
  Flightcontrol charges a fixed monthly subscription fee for its platform on top
  of your own AWS infrastructure costs (which you pay directly to AWS). Tiers are
  defined by the number of included services, the number of users, and the set of
  platform features (preview environments, RBAC, multi-region, SSO, compliance
  reports, support level). Additional services beyond a plan's included count are
  billed per service per month. The HTTP API and deploy hooks are available across
  plans.
notes: >-
  Prices reflect the Flightcontrol pricing page; verify current numbers, service
  caps, and feature gating on the page during reconciliation. AWS usage is billed
  separately by AWS.
sources:
- https://www.flightcontrol.dev/pricing
- https://www.flightcontrol.dev/docs
plans:
- id: flightcontrol-single-user
  name: Single User (Free)
  type: free
  description: >-
    Free single-user plan for personal repositories with unlimited projects,
    environments, and deployments. Community support. AWS infrastructure billed
    separately.
  entries:
  - label: Monthly Platform Fee
    name: platform_fee
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  - label: Included Users
    name: users
    type: flat
    metric: users
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
