specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Flightcontrol
providerId: flightcontrol
created: '2026-06-20'
modified: '2026-06-20'
reconciled: true
tags:
- Deployment
- AWS
- PaaS
- Infrastructure
- DevOps
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Flightcontrol spend. Flightcontrol bills a fixed monthly platform
  subscription per plan (Single User / Starter / Business / Enterprise) plus a
  per-service-per-month charge for services beyond a plan's included count. Crucially,
  the AWS infrastructure that Flightcontrol provisions is billed directly to the
  customer's own AWS account, so total cost of ownership combines the Flightcontrol
  subscription with raw AWS usage. Cost budgets and alerts are available for the
  AWS spend Flightcontrol provisions.
notes: >-
  Plan fees and per-service rates are subject to change; verify against the
  Flightcontrol pricing page during reconciliation. AWS usage is metered and
  invoiced by AWS, not by Flightcontrol.
sources:
- https://www.flightcontrol.dev/pricing
- https://www.flightcontrol.dev/docs
- https://www.flightcontrol.dev/blog/announcing-s3-buckets-and-cost-budgets-alerts
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Flightcontrol
serviceCategory: Developer Tools and Deployment
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Flightcontrol
  ServiceCategory: Developer Tools and Deployment
  ProviderName: Flightcontrol
  PublisherName: Flightcontrol
  InvoiceIssuerName: Flightcontrol
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: platform_subscription
  description: Fixed monthly platform fee for the selected plan (Starter, Business, Enterprise).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: additional_services
  description: Services beyond the plan's included count, billed per service per month.
  unit: services
  aggregation: sum
  dimensions:
  - account
  - plan
- name: seats
  description: Users on the account, bounded by plan user caps.
  unit: users
  aggregation: max
  dimensions:
  - account
  - plan
- name: aws_infrastructure
  description: >-
    AWS resources (compute, storage, CloudFront, networking) provisioned by
    Flightcontrol and billed directly by AWS to the customer's own AWS account.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - aws_service
  - region
principles:
- name: Visibility
  description: Separate the fixed Flightcontrol subscription from variable AWS usage; pull AWS Cost Explorer / CUR data for the underlying infrastructure.
- name: Allocation
  description: Map projects, environments, and services to teams and cost centers; tag AWS resources for chargeback.
- name: Optimization
  description: Right-size service counts against plan tiers, scale services down via the scaling API when idle, and use Flightcontrol cost budgets and alerts on AWS spend.
- name: Accountability
  description: Assign owners per project/environment; review the monthly Flightcontrol invoice and AWS bill together against budget.
maintainers:
